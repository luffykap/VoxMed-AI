<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxMed AI - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-view" class="view-container">
        <div class="login-box">
            <h2>VoxMed Admin Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn primary-btn">Login</button>
                <div id="login-error" class="error-msg hidden">Invalid credentials</div>
            </form>
        </div>
    </div>

    <div id="dashboard-view" class="view-container hidden">
        <nav class="sidebar">
            <div class="logo">
                <h2>VoxMed AI</h2>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active" data-target="appointments-section">Appointments</a></li>
                <li><a href="#" data-target="slots-section">Manage Slots</a></li>
            </ul>
            <div class="logout-container">
                <button id="logout-btn" class="btn outline-btn">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <header>
                <h1>Dashboard Overview</h1>
            </header>
            
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Today's Appointments</h3>
                    <p id="stat-today-appointments">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Active</h3>
                    <p id="stat-total-active">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Doctors</h3>
                    <p id="stat-total-doctors">0</p>
                </div>
            </div>

            <section id="appointments-section" class="content-section">
                <h2>Recent Appointments</h2>
                <div class="table-container">
                    <table id="appointments-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Patient Name</th>
                                <th>Phone</th>
                                <th>Doctor</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <section id="slots-section" class="content-section hidden">
                <h2>Manage Slots</h2>
                <div class="card slot-management-card">
                    <form id="add-slot-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="slot-doctor">Doctor</label>
                                <select id="slot-doctor" required>
                                    <option value="">Select Doctor</option>
                                    <!-- Populated by JS -->
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="slot-date">Date</label>
                                <input type="date" id="slot-date" required>
                            </div>
                            <div class="form-group">
                                <label for="slot-time">Time</label>
                                <input type="time" id="slot-time" required>
                            </div>
                            <div class="form-group" style="display: flex; align-items: flex-end;">
                                <button type="submit" class="btn primary-btn">Add Slot</button>
                            </div>
                        </div>
                        <div id="slot-message" class="hidden"></div>
                    </form>
                </div>

                <h3>Available Slots</h3>
                <div class="filters">
                    <div class="form-group inline">
                        <label for="filter-doctor">Filter by Doctor:</label>
                        <select id="filter-doctor">
                            <option value="">All Doctors</option>
                        </select>
                    </div>
                </div>
                <div class="table-container">
                    <table id="slots-table">
                        <thead>
                            <tr>
                                <th>Doctor</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
